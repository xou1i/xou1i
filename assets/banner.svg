<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Light but visible grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58687F" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&amp;display=swap');
    </style>
  </defs>

  <!-- Flat background -->
  <rect width="1200" height="320" fill="#010E50"/>
  
  <!-- The Grid -->
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Animated scanning line (flat gold) -->
  <rect x="0" y="0" width="1200" height="2" fill="#FFC04B" opacity="0.2">
    <animate attributeName="y" values="0;320;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Expanded Professional Pixel Accents with Motion -->
  <!-- Top Left Cluster -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="4s" repeatCount="indefinite"/>
    <rect x="40" y="40" width="8" height="8" fill="#FFC04B" rx="1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="52" y="40" width="8" height="8" fill="#58687F" rx="1"/>
    <rect x="40" y="52" width="8" height="8" fill="#58687F" rx="1"/>
    <rect x="52" y="52" width="8" height="8" fill="#FFC04B" rx="1" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Top Right Cluster -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="5s" repeatCount="indefinite"/>
    <rect x="1140" y="40" width="8" height="8" fill="#FFC04B" rx="1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1128" y="40" width="8" height="8" fill="#58687F" rx="1"/>
    <rect x="1140" y="52" width="8" height="8" fill="#58687F" rx="1"/>
    <rect x="1152" y="64" width="8" height="8" fill="#FFC04B" rx="1" opacity="0.6"/>
  </g>

  <!-- Bottom Left Cluster -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0; 4,4; 0,0" dur="6s" repeatCount="indefinite"/>
    <rect x="80" y="260" width="12" height="12" fill="#58687F" rx="1.5"/>
    <rect x="96" y="244" width="8" height="8" fill="#FFC04B" rx="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="64" y="276" width="8" height="8" fill="#FFC04B" rx="1" opacity="0.8"/>
  </g>

  <!-- Bottom Right Cluster -->
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0; -4,2; 0,0" dur="4.5s" repeatCount="indefinite"/>
    <rect x="1100" y="260" width="12" height="12" fill="#58687F" rx="1.5"/>
    <rect x="1116" y="276" width="8" height="8" fill="#FFC04B" rx="1">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1084" y="244" width="8" height="8" fill="#FFC04B" rx="1"/>
  </g>

  <!-- Scattered Floating Elements to add "Life" -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,10; 0,0" dur="7s" repeatCount="indefinite"/>
    <rect x="240" y="100" width="4" height="4" fill="#FFC04B" opacity="0.6" rx="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite"/>
    <rect x="360" y="220" width="6" height="6" fill="#58687F" opacity="0.6" rx="1"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -5,5; 0,0" dur="5s" repeatCount="indefinite"/>
    <rect x="880" y="90" width="5" height="5" fill="#FFC04B" opacity="0.6" rx="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 5,-5; 0,0" dur="8s" repeatCount="indefinite"/>
    <rect x="940" y="240" width="4" height="4" fill="#58687F" opacity="0.5" rx="0.5"/>
  </g>

  <!-- Expanding Center Pulse to give a heartbeat effect to the whole banner -->
  <circle cx="600" cy="155" r="140" fill="none" stroke="#FFC04B" stroke-width="1.5" opacity="0.1">
    <animate attributeName="r" values="130; 160; 130" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05; 0.15; 0.05" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Dynamic Text Group -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,3; 0,0" dur="5s" repeatCount="indefinite"/>
    
    <!-- Main heading -->
    <text x="600" y="145" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="48" fill="#FFFFFF" letter-spacing="2">
      Hello! I'm Ghaith
    </text>

    <!-- Flat gold underline (animated width on load) -->
    <rect x="410" y="165" width="380" height="3" fill="#FFC04B" rx="1.5" opacity="0.8">
      <animate attributeName="width" values="0;380" dur="1.5s" fill="freeze"/>
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Role description -->
    <text x="600" y="210" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="400" font-size="18" fill="#58687F" letter-spacing="1.5">
      Full-Stack Developer  &amp;  UI/UX Designer
    </text>
  </g>

  <!-- Flat bottom border accent -->
  <rect x="0" y="315" width="1200" height="5" fill="#FFC04B" opacity="0.5"/>
</svg>
