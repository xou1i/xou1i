<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a6c" stroke-width="0.4" opacity="0.25"/>
    </pattern>

    <!-- Soft glow for accent elements -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle gradient overlay -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010E50"/>
      <stop offset="50%" stop-color="#060f3a"/>
      <stop offset="100%" stop-color="#010E50"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC04B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFC04B" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFC04B" stop-opacity="0"/>
    </linearGradient>

    <!-- Montserrat font import -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Animated scanning line -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#goldLine)" opacity="0.3">
    <animate attributeName="y" values="0;320;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Pixel accent cluster - top left -->
  <g opacity="0.6">
    <rect x="60" y="40" width="4" height="4" fill="#FFC04B" rx="0.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="36" width="3" height="3" fill="#58687F" rx="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="52" y="50" width="5" height="5" fill="#FFC04B" rx="0.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="46" width="3" height="3" fill="#58687F" rx="0.5">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pixel accent cluster - top right -->
  <g opacity="0.6">
    <rect x="1120" y="35" width="4" height="4" fill="#FFC04B" rx="0.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1105" y="42" width="3" height="3" fill="#58687F" rx="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1135" y="50" width="5" height="5" fill="#FFC04B" rx="0.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1098" y="55" width="3" height="3" fill="#58687F" rx="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pixel accent cluster - bottom left -->
  <g opacity="0.5">
    <rect x="90" y="260" width="4" height="4" fill="#FFC04B" rx="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="78" y="270" width="3" height="3" fill="#58687F" rx="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="102" y="275" width="5" height="5" fill="#FFC04B" rx="0.5">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Pixel accent cluster - bottom right -->
  <g opacity="0.5">
    <rect x="1100" y="255" width="4" height="4" fill="#FFC04B" rx="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1115" y="268" width="3" height="3" fill="#58687F" rx="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1088" y="272" width="5" height="5" fill="#FFC04B" rx="0.5">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="5.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Scattered pixel dots - mid area -->
  <rect x="200" y="90" width="2" height="2" fill="#FFC04B" opacity="0.3" rx="0.5">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="350" y="240" width="2" height="2" fill="#58687F" opacity="0.3" rx="0.5">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="850" y="80" width="2" height="2" fill="#FFC04B" opacity="0.3" rx="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="950" y="230" width="2" height="2" fill="#58687F" opacity="0.3" rx="0.5">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="500" y="60" width="2" height="2" fill="#FFC04B" opacity="0.25" rx="0.5">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="6.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="700" y="260" width="2" height="2" fill="#58687F" opacity="0.25" rx="0.5">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="7.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Thin horizontal accent lines -->
  <line x1="140" y1="130" x2="360" y2="130" stroke="#58687F" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite"/>
  </line>
  <line x1="840" y1="130" x2="1060" y2="130" stroke="#58687F" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite" begin="3s"/>
  </line>

  <!-- Main heading -->
  <text x="600" y="125" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="46" fill="#FFFFFF" letter-spacing="2">
    Hello! I'm Ghaith
  </text>

  <!-- Gold accent underline beneath heading -->
  <rect x="410" y="142" width="380" height="2.5" fill="url(#goldLine)" rx="1.25">
    <animate attributeName="width" values="0;380" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- Tagline -->
  <text x="600" y="180" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="300" font-size="18" fill="#FFC04B" letter-spacing="4" opacity="0.9">
    Be Obsessed Or Be Average
  </text>

  <!-- Role description -->
  <text x="600" y="220" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="400" font-size="16" fill="#58687F" letter-spacing="1">
    Full-Stack Developer  &amp;  UI/UX Designer
  </text>

  <!-- Subtle bottom border accent -->
  <rect x="0" y="315" width="1200" height="5" fill="url(#goldLine)" opacity="0.6"/>

  <!-- Corner pixel brackets - top left -->
  <g opacity="0.35">
    <rect x="20" y="15" width="30" height="2" fill="#FFC04B"/>
    <rect x="20" y="15" width="2" height="30" fill="#FFC04B"/>
  </g>

  <!-- Corner pixel brackets - top right -->
  <g opacity="0.35">
    <rect x="1150" y="15" width="30" height="2" fill="#FFC04B"/>
    <rect x="1178" y="15" width="2" height="30" fill="#FFC04B"/>
  </g>

  <!-- Corner pixel brackets - bottom left -->
  <g opacity="0.35">
    <rect x="20" y="298" width="30" height="2" fill="#FFC04B"/>
    <rect x="20" y="270" width="2" height="30" fill="#FFC04B"/>
  </g>

  <!-- Corner pixel brackets - bottom right -->
  <g opacity="0.35">
    <rect x="1150" y="298" width="30" height="2" fill="#FFC04B"/>
    <rect x="1178" y="270" width="2" height="30" fill="#FFC04B"/>
  </g>

  <!-- Breathing pulse ring behind heading area -->
  <circle cx="600" cy="160" r="120" fill="none" stroke="#FFC04B" stroke-width="0.5" opacity="0.08">
    <animate attributeName="r" values="120;140;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.15;0.08" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="160" r="160" fill="none" stroke="#58687F" stroke-width="0.3" opacity="0.05">
    <animate attributeName="r" values="160;180;160" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.1;0.05" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
