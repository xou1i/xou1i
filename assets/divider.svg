<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#010E50" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58687F" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFC04B" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#58687F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#010E50" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Main divider line -->
  <line x1="0" y1="6" x2="1200" y2="6" stroke="url(#divGrad)" stroke-width="1"/>
  
  <!-- Center pixel diamond -->
  <rect x="596" y="2" width="8" height="8" fill="#FFC04B" opacity="0.7" transform="rotate(45 600 6)"/>
  
  <!-- Side pixel dots -->
  <rect x="560" y="4.5" width="3" height="3" fill="#58687F" opacity="0.4" rx="0.5"/>
  <rect x="637" y="4.5" width="3" height="3" fill="#58687F" opacity="0.4" rx="0.5"/>
  <rect x="540" y="5" width="2" height="2" fill="#FFC04B" opacity="0.25" rx="0.5"/>
  <rect x="658" y="5" width="2" height="2" fill="#FFC04B" opacity="0.25" rx="0.5"/>
</svg>
