<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58687F" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&amp;display=swap');
    </style>
  </defs>

  <!-- Flat background -->
  <rect width="1200" height="200" fill="#010E50"/>
  <rect width="1200" height="200" fill="url(#grid)"/>

  <!-- Flat top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="#FFC04B" opacity="0.5">
    <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Professional Pixel accents with motion -->
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="4s" repeatCount="indefinite"/>
    <rect x="100" y="60" width="8" height="8" fill="#FFC04B" rx="1">
       <animate attributeName="opacity" values="0.5; 1; 0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="112" y="72" width="8" height="8" fill="#58687F" rx="1"/>
  </g>
  <g opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,3; 0,0" dur="4.5s" repeatCount="indefinite"/>
    <rect x="1080" y="60" width="12" height="12" fill="#58687F" rx="1.5"/>
    <rect x="1064" y="76" width="8" height="8" fill="#FFC04B" rx="1">
       <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Footer text with floating animation -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,2; 0,0" dur="4s" repeatCount="indefinite"/>
    
    <text x="600" y="85" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="300" font-size="15" fill="#58687F" letter-spacing="3">
      Designed with precision. Built with purpose.
    </text>
    
    <text x="600" y="120" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="600" font-size="14" fill="#FFC04B" letter-spacing="6" opacity="0.9">
      GHAITH
    </text>

    <!-- Flat underline -->
    <rect x="540" y="136" width="120" height="2" fill="#FFC04B" opacity="0.5" rx="1">
       <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Year -->
    <text x="600" y="170" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="300" font-size="11" fill="#58687F" letter-spacing="2" opacity="0.6">
      2025
    </text>
  </g>
</svg>
